name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 06:00 UTC: catch new advisories on code that hasn't changed.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Blocking: what ships to Vercel must have no high or critical advisories.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      # Reported, not blocking: dev tooling never runs in production.
      # Dependabot opens the upgrade PRs for these.
      - name: Audit all dependencies (report only)
        run: |
          {
            echo "## npm audit (all dependencies)"
            echo '```'
            npm audit --audit-level=none || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
